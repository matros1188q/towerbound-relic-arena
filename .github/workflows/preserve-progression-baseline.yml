name: Preserve pre-progression baseline
on:
  push:
    branches: [feature/progression-24]
    paths: [.github/workflows/preserve-progression-baseline.yml]
permissions:
  contents: write
jobs:
  tag-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create immutable baseline tag
        env:
          BASELINE_SHA: e77ef1f3e1d6a7d2eb98b088f8bfa8a5dcc0ebe6
        run: |
          set -euo pipefail
          git fetch --force origin
          if git show-ref --tags --verify --quiet refs/tags/legacy-before-progression; then
            existing="$(git rev-list -n 1 legacy-before-progression)"
            test "$existing" = "$BASELINE_SHA"
          else
            git tag legacy-before-progression "$BASELINE_SHA"
            git push origin refs/tags/legacy-before-progression
          fi
