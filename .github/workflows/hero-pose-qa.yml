name: Free hero pose landmark QA
on:
  push:
    branches: [main]
    paths:
      - "scripts/analyze_hero_pose.py"
      - "scripts/extract_limb_candidates.py"
      - ".github/workflows/hero-pose-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hero-pose-qa
  cancel-in-progress: false
jobs:
  pose-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU pose inference
        run: |
          python -m pip install --upgrade pip
          pip install "ultralytics>=8.3,<9" "pillow>=10,<12" "numpy<2"
      - name: Infer candidate body landmarks and render QA previews
        run: python scripts/analyze_hero_pose.py
      - name: Generate conservative limb cutout candidates
        run: python scripts/extract_limb_candidates.py
      - name: Upload landmark report and previews
        uses: actions/upload-artifact@v4
        with:
          name: hero-pose-qa
          path: |
            artifacts/pose-analysis/
            artifacts/limb-candidates/
          if-no-files-found: error
