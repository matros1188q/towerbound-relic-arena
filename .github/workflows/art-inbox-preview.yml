name: Art inbox character preview
on:
  push:
    branches: [main]
    paths:
      - "art-inbox/01-characters/**"
      - ".github/workflows/art-inbox-preview.yml"
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install 'rembg[cpu]' Pillow
      - name: Build contact sheet and image index
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          from rembg import remove, new_session
          from io import BytesIO
          import json, hashlib, shutil

          root = Path("art-inbox/01-characters")
          out = Path("art-preview")
          out.mkdir(exist_ok=True)
          files = sorted(p for p in root.iterdir() if p.is_file() and p.suffix.lower() in {".png", ".jpg", ".jpeg", ".webp"})
          originals = out / "originals"
          originals.mkdir(exist_ok=True)
          processed = out / "processed"
          processed.mkdir(exist_ok=True)
          session = new_session("isnet-general-use")
          font = ImageFont.load_default()
          tile_w, tile_h, label_h, cols = 260, 340, 48, 3
          rows = max(1, (len(files) + cols - 1) // cols)
          sheet = Image.new("RGB", (cols * tile_w, rows * (tile_h + label_h)), "#151a22")
          draw = ImageDraw.Draw(sheet)
          records = []
          for i, path in enumerate(files):
              try:
                  raw = path.read_bytes()
                  shutil.copy2(path, originals / path.name)
                  cutout_bytes = remove(raw, session=session, post_process_mask=True, alpha_matting=False)
                  out_im = Image.open(BytesIO(cutout_bytes)).convert("RGBA")
                  # Restore the Arcanist's saturated violet-blue crystal/staff details,
                  # which the human segmentation model can mistake for a separate object.
                  if path.name == "16f4bbb7-a8ac-4cb3-8d93-a9647458bf3f.jpg":
                      original = Image.open(BytesIO(raw)).convert("RGB")
                      hsv = original.convert("HSV")
                      for yy in range(0, min(480, original.height)):
                          for xx in range(680, min(920, original.width)):
                              hh, ss, vv = hsv.getpixel((xx, yy))
                              if 150 <= hh <= 250 and ss > 28 and vv > 32:
                                  rr, gg, bb = original.getpixel((xx, yy))
                                  aa = 255 if ss >= 60 else max(0, min(255, int((ss - 28) * 8)))
                                  old = out_im.getpixel((xx, yy))
                                  if aa > old[3]:
                                      out_im.putpixel((xx, yy), (rr, gg, bb, aa))
                  buffer = BytesIO()
                  out_im.save(buffer, format="PNG", optimize=True)
                  cutout_bytes = buffer.getvalue()
                  cutout_path = processed / (path.stem + ".png")
                  cutout_path.write_bytes(cutout_bytes)
                  with Image.open(path) as im:
                      im.load()
                      fmt = im.format
                      size = list(im.size)
                      mode = im.mode
                      has_alpha = "A" in im.getbands() or "transparency" in im.info
                      out_im = Image.open(BytesIO(cutout_bytes)).convert("RGBA")
                      thumb = ImageOps.contain(out_im, (tile_w - 24, tile_h - 24))
                      tile = Image.new("RGBA", (tile_w - 16, tile_h - 16), "#222a35")
                      tile.alpha_composite(thumb, ((tile.width-thumb.width)//2, (tile.height-thumb.height)//2))
                      x = (i % cols) * tile_w + 8
                      y = (i // cols) * (tile_h + label_h) + 8
                      sheet.paste(tile.convert("RGB"), (x, y))
                      draw.text((x, y + tile_h - 2), path.name[:34], fill="#f2f2f2", font=font)
                  records.append({"filename":path.name,"relative_path":str(path),"format":fmt,"width":size[0],"height":size[1],"mode":mode,"source_has_alpha":has_alpha,"processed_format":"PNG","processed_width":out_im.width,"processed_height":out_im.height,"processed_has_alpha":("A" in out_im.getbands()),"bytes":len(raw),"processed_bytes":len(cutout_bytes),"sha256":hashlib.sha256(raw).hexdigest()})
              except Exception as e:
                  records.append({"filename":path.name,"relative_path":str(path),"error":str(e)})
          sheet.save(out / "characters-contact-sheet.jpg", quality=88)
          (out / "characters-index.json").write_text(json.dumps({"count":len(records),"images":records},ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({"count":len(records),"files":[r["filename"] for r in records]},ensure_ascii=False))
          PY
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: towerbound-character-preview
          path: art-preview/
          if-no-files-found: error
          retention-days: 7

      - name: Integrate four hero portraits and update selector cards
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, shutil

          mapping = [
              {"id":"warden","source":"7f5c7457-3498-464f-91df-d83335183855.png","path":"assets/characters/heroes/warden.png","note":"Confirmed: armored guardian with tower shield"},
              {"id":"arcanist","source":"16f4bbb7-a8ac-4cb3-8d93-a9647458bf3f.png","path":"assets/characters/heroes/arcanist.png","note":"Confirmed: violet-robed mage; violet-blue crystal details restored from source"},
              {"id":"ranger","source":"7305bd9e-5b85-49ad-a701-ec8ad192dcd7.png","path":"assets/characters/heroes/ranger.png","note":"Confirmed: hooded archer with bow and quiver"},
              {"id":"reaper","source":"acea49d3-fa54-45a9-957a-ac057304b6ab.png","path":"assets/characters/heroes/reaper.png","note":"Provisional: dark armored reaper-like warrior; source weapon is a sword, not the specified scythe"}
          ]
          for item in mapping:
              src = Path("art-preview/processed") / item["source"]
              dst = Path(item["path"])
              if not src.exists():
                  raise SystemExit(f"Missing processed portrait: {src}")
              with Image.open(src) as im:
                  if im.format != "PNG" or im.mode != "RGBA" or im.size != (1024, 1024):
                      raise SystemExit(f"Unexpected processed image format for {src}: {im.format}, {im.mode}, {im.size}")
                  if im.getchannel("A").getextrema() == (255, 255):
                      raise SystemExit(f"No transparency found in {src}")
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8")
          for hero_id in ["warden","arcanist","ranger","reaper"]:
              art = f"art:'./assets/characters/heroes/{hero_id}.png',"
              marker = f"id:'{hero_id}',"
              if art not in html:
                  if html.count(marker) != 1:
                      raise SystemExit(f"Could not safely locate unique ID for {hero_id} in index.html")
                  html = html.replace(marker, marker + art, 1)

          old_markup = '<div class="tb-hero-emblem">'+h.icon+'</div>'
          new_markup = """<div class="tb-hero-portrait"><img src="'+h.art+'" alt="'+h.name+'" loading="lazy" decoding="async"></div>"""
          if new_markup not in html:
              if html.count(old_markup) != 1:
                  raise SystemExit("Could not safely locate hero card image slot in renderHeroSelect()")
              html = html.replace(old_markup, new_markup, 1)

          style_id = 'id="tb-hero-portrait-art-v1"'
          if style_id not in html:
              style = """<style id="tb-hero-portrait-art-v1">
          #heroChoices .tb-hero-portrait{width:100%;height:142px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:10px;background:radial-gradient(ellipse at 50% 42%,#344056 0%,#151b29 72%);border:1px solid #b8c6dd22}
          #heroChoices .tb-hero-portrait img{display:block;width:100%;height:100%;object-fit:contain;object-position:center center;filter:drop-shadow(0 5px 9px #000b)}
          @media(max-width:520px){#heroChoices .tb-hero-portrait{height:126px}}
          </style>
          """
              if "</head>" not in html:
                  raise SystemExit("Missing </head>; refusing to patch hero portrait CSS")
              html = html.replace("</head>", style + "</head>", 1)
          index_path.write_text(html, encoding="utf-8")

          manifest = {
              "pack":"towerbound-heroes-batch-1",
              "version":"1.0.0",
              "processing":"rembg isnet-general-use with alpha channel validation",
              "assets":mapping
          }
          Path("assets/characters/heroes/manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8")
          print("Prepared 4 transparent hero portraits and hero selector markup.")
          PY
      - name: Commit integrated hero portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/heroes index.html
          if git diff --cached --quiet; then
            echo "Hero portraits already integrated; no changes to commit."
          else
            git commit -m "Add four transparent hero portraits to selector"
            git push
          fi
