name: Art inbox character preview
on:
  push:
    branches: [main]
    paths:
      - "art-inbox/01-characters/**"
      - "art-inbox/03-synergies/**"
      - "art-inbox/04-skills/**"
      - ".github/workflows/art-inbox-preview.yml"
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install 'rembg[cpu]' Pillow
      - name: Build contact sheet and image index
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          from rembg import remove, new_session
          from io import BytesIO
          import json, hashlib, shutil

          root = Path("art-inbox/01-characters")
          out = Path("art-preview")
          out.mkdir(exist_ok=True)
          files = sorted(p for p in root.iterdir() if p.is_file() and p.suffix.lower() in {".png", ".jpg", ".jpeg", ".webp"})
          originals = out / "originals"
          originals.mkdir(exist_ok=True)
          processed = out / "processed"
          processed.mkdir(exist_ok=True)
          session = new_session("isnet-general-use")
          font = ImageFont.load_default()
          tile_w, tile_h, label_h, cols = 260, 340, 48, 3
          rows = max(1, (len(files) + cols - 1) // cols)
          sheet = Image.new("RGB", (cols * tile_w, rows * (tile_h + label_h)), "#151a22")
          draw = ImageDraw.Draw(sheet)
          records = []
          for i, path in enumerate(files):
              try:
                  raw = path.read_bytes()
                  shutil.copy2(path, originals / path.name)
                  cutout_bytes = remove(raw, session=session, post_process_mask=True, alpha_matting=False)
                  out_im = Image.open(BytesIO(cutout_bytes)).convert("RGBA")
                  # Restore the Arcanist's saturated violet-blue crystal/staff details,
                  # which the human segmentation model can mistake for a separate object.
                  if path.name == "16f4bbb7-a8ac-4cb3-8d93-a9647458bf3f.jpg":
                      original = Image.open(BytesIO(raw)).convert("RGB")
                      hsv = original.convert("HSV")
                      for yy in range(0, min(480, original.height)):
                          for xx in range(680, min(920, original.width)):
                              hh, ss, vv = hsv.getpixel((xx, yy))
                              if 150 <= hh <= 250 and ss > 28 and vv > 32:
                                  rr, gg, bb = original.getpixel((xx, yy))
                                  aa = 255 if ss >= 60 else max(0, min(255, int((ss - 28) * 8)))
                                  old = out_im.getpixel((xx, yy))
                                  if aa > old[3]:
                                      out_im.putpixel((xx, yy), (rr, gg, bb, aa))
                  buffer = BytesIO()
                  out_im.save(buffer, format="PNG", optimize=True)
                  cutout_bytes = buffer.getvalue()
                  cutout_path = processed / (path.stem + ".png")
                  cutout_path.write_bytes(cutout_bytes)
                  with Image.open(path) as im:
                      im.load()
                      fmt = im.format
                      size = list(im.size)
                      mode = im.mode
                      has_alpha = "A" in im.getbands() or "transparency" in im.info
                      out_im = Image.open(BytesIO(cutout_bytes)).convert("RGBA")
                      thumb = ImageOps.contain(out_im, (tile_w - 24, tile_h - 24))
                      tile = Image.new("RGBA", (tile_w - 16, tile_h - 16), "#222a35")
                      tile.alpha_composite(thumb, ((tile.width-thumb.width)//2, (tile.height-thumb.height)//2))
                      x = (i % cols) * tile_w + 8
                      y = (i // cols) * (tile_h + label_h) + 8
                      sheet.paste(tile.convert("RGB"), (x, y))
                      draw.text((x, y + tile_h - 2), path.name[:34], fill="#f2f2f2", font=font)
                  records.append({"filename":path.name,"relative_path":str(path),"format":fmt,"width":size[0],"height":size[1],"mode":mode,"source_has_alpha":has_alpha,"processed_format":"PNG","processed_width":out_im.width,"processed_height":out_im.height,"processed_has_alpha":("A" in out_im.getbands()),"bytes":len(raw),"processed_bytes":len(cutout_bytes),"sha256":hashlib.sha256(raw).hexdigest()})
              except Exception as e:
                  records.append({"filename":path.name,"relative_path":str(path),"error":str(e)})
          sheet.save(out / "characters-contact-sheet.jpg", quality=88)
          (out / "characters-index.json").write_text(json.dumps({"count":len(records),"images":records},ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({"count":len(records),"files":[r["filename"] for r in records]},ensure_ascii=False))
          PY
      - name: Remove checkerboard and prepare synergy and skill PNGs
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from rembg import remove, new_session
          from io import BytesIO
          import json
          synergy = [
              ("🔥 Огонь","fire","7ff81e6b-167f-4c94-85d2-e223531a420c.jpg"),
              ("☠️ Яд","poison","3aad2655-2998-4edc-b4a5-220da19c3d55.jpg"),
              ("⚡ Гроза","storm","a9ce1cfb-4899-4681-93f3-b7d1d33d32a7.jpg"),
              ("🌀 Бездна","abyss","2c4acddd-9364-49c0-bc51-cb2e59e75133.jpg"),
              ("🌿 Жизнь","life","f71ed8de-2710-440d-bc5c-50b57a95dd8a.jpg"),
              ("🏹 Залп","volley","0860a6f2-ee03-43da-a57d-4a2454d215d3.jpg"),
              ("❄️ Лёд","ice","644c2e2b-a9ad-4ac2-85d2-e61f45b1ee94.jpg"),
              ("🔮 Тайна","mystery","32b37744-fbbd-43fc-8e62-94841fadfb4e.jpg"),
              ("🪙 Удача","luck","583da39e-7b48-496d-a722-77023039b653.jpg"),
              ("🩸 Кровь","blood","0740cc09-c099-4bb9-b76a-37abf74b13ac.jpg"),
              ("🛡️ Стража","guard","3d67af2a-3b9c-4f61-ac94-d528d13c2681.jpg"),
              ("🌟 Свет","light","a231c118-5ce7-442c-81c8-4e8093c8d799.jpg"),
              ("⏳ Время","time","0a2023ba-5fa8-4ff3-9105-e5e3c56b22b7.jpg"),
              ("⚔️ Сталь","steel","4903f62f-355a-4dbf-8fa1-6086e28c359f.jpg"),
              ("🕯️ Дух","spirit","daa8916f-48fa-4826-8c94-3b6b0db74e8c.jpg")
          ]
          skills = [
              ("fire","8b657d53-18ca-462d-87da-f06a71bc778c.jpg"),
              ("arcane","c3f26f2a-d280-4aab-86de-c7bd85f7c059.jpg"),
              ("ice","fc9b8abf-3ae7-428d-aa20-a84a05d20590.jpg"),
              ("lightning","adf73a7d-58bd-4bbe-8e0d-4a2abe4d7c7d.jpg"),
              ("nature","89e07ca1-dafe-4142-bfd1-a9b9922b1b34.jpg"),
              ("void","6513e024-a01f-43ad-ad4f-50410d779fd1.jpg")
          ]
          session = new_session("isnet-general-use")
          out = Path("art-preview/ui-processed")
          report = {"synergies":[],"skills":[]}
          for category, rows in [("synergies",synergy),("skills",skills)]:
              source_root = Path("art-inbox/03-synergies" if category=="synergies" else "art-inbox/04-skills")
              for row in rows:
                  label, slug, filename = row if category=="synergies" else (row[0],row[0],row[1])
                  source = source_root / filename
                  if not source.is_file():
                      raise SystemExit(f"Missing source image: {source}")
                  cutout = remove(source.read_bytes(), session=session, post_process_mask=True, alpha_matting=False)
                  image = Image.open(BytesIO(cutout)).convert("RGBA")
                  alpha = image.getchannel("A")
                  if alpha.getextrema() == (255,255) or alpha.getbbox() is None:
                      raise SystemExit(f"Background removal did not produce a usable transparent PNG: {filename}")
                  target = out / category / (slug + ".png")
                  target.parent.mkdir(parents=True,exist_ok=True)
                  image.save(target,format="PNG",optimize=True)
                  report[category].append({
                      "id":slug,"label":label,"source":filename,"file":str(target),
                      "width":image.width,"height":image.height,
                      "alpha_bounds":list(alpha.getbbox()),"bytes":target.stat().st_size
                  })
          (out/"qa-report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({"synergies":len(report["synergies"]),"skills":len(report["skills"]),"processed":sum(len(v) for v in report.values())},ensure_ascii=False))
          PY
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: towerbound-character-preview
          path: art-preview/
          if-no-files-found: error
          retention-days: 7

      - name: Integrate hero, enemy and boss artwork
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, shutil

          heroes = [
              {"id":"warden","source":"7f5c7457-3498-464f-91df-d83335183855.jpg","path":"assets/characters/heroes/warden.png","note":"Armored guardian with tower shield"},
              {"id":"arcanist","source":"16f4bbb7-a8ac-4cb3-8d93-a9647458bf3f.jpg","path":"assets/characters/heroes/arcanist.png","note":"Violet-robed mage with arcane staff"},
              {"id":"ranger","source":"7305bd9e-5b85-49ad-a701-ec8ad192dcd7.jpg","path":"assets/characters/heroes/ranger.png","note":"Hooded archer with bow and quiver"},
              {"id":"reaper","source":"acea49d3-fa54-45a9-957a-ac057304b6ab.jpg","path":"assets/characters/heroes/reaper.png","note":"Dark armored reaper-like warrior; source carries a sword rather than a scythe"}
          ]

          enemies = [
              {"id":"shadow-goblin","source":"aa933809-05b4-4b67-9f5f-442ffd207371.jpg","note":"Hunched dark creature with a glowing red eye; closest available shadow-assassin silhouette"},
              {"id":"cursed-knight","source":"5c8f39fb-19c6-44e4-946c-4ee584214238.jpg","note":"Black-armored sword knight"},
              {"id":"ash-wolf","source":"81c5d782-ceb2-4e17-813a-b4c684f70f75.jpg","note":"Ash-gray supernatural wolf"},
              {"id":"rune-golem","source":"289412ff-344a-402b-b141-3e739f1d1c1c.jpg","note":"Large stone-and-root golem with a glowing core"},
              {"id":"grave-archer","source":"1a06e424-a782-44b7-a0a0-a9f64325ffcb.jpg","note":"Skeletal archer with a bone bow"},
              {"id":"plague-witch","source":"52cbe629-d020-4077-8a86-2469a3cda66d.jpg","note":"Toxic alchemist-witch with potion vials"},
              {"id":"ash-imp","source":"50bbefaa-97e5-4c6d-8a73-daa03e553525.jpg","note":"Winged ember demon"},
              {"id":"swamp-reaper","source":"ba3335bd-e111-4f86-90e6-4f2085cae804.jpg","note":"Waterlogged swamp wraith with a crooked staff"},
              {"id":"bone-warden","source":"00cba976-f8e1-4691-af34-7e38bc3e085e.jpg","note":"Skeletal armored guardian"},
              {"id":"crimson-executioner","source":"b0b7437e-c2ee-4a59-b644-ffce88f1d442.jpg","note":"Crimson armored executioner-like warrior"},
              {"id":"void-hunter","source":"92a10c4d-48e4-4a3c-92e5-bb7bae921f8d.jpg","note":"Hooded void assassin with violet blades"},
              {"id":"spider-matron","source":"f3f1e987-472d-41ab-aa6c-f6e11d8068ba.jpg","note":"Large many-legged spider creature"},
              {"id":"blind-monk","source":"c05adc5c-64e2-476a-8a4d-e92eb774c5d8.jpg","note":"Hooded staff-bearing monk-like figure"},
              {"id":"stone-minotaur","source":"678287f6-5d47-407d-a281-65b1e7eb2463.jpg","note":"Stone-skinned minotaur with a heavy axe"},
              {"id":"phantom-duelist","source":"a41493b8-0505-40f2-8351-fb8f1b484c8c.jpg","note":"Spectral swordsman with a glowing blade"},
              {"id":"soul-harvester","source":"00478c4a-e6ee-420d-a3f8-dd8c03c4698e.jpg","note":"Hooded lantern-bearing soul collector"},
              {"id":"forest-horror","source":"477537a8-9c39-497b-b809-8fb63968d5a9.jpg","note":"Twisted ancient tree monster"},
              {"id":"abyss-knight","source":"bd0e9796-5649-4bad-a565-4067b2c602d3.jpg","note":"Dark armored knight with a violet blade"},
              {"id":"cursed-alchemist","source":"d6021025-d9b9-44da-a245-2c50822ebedc.jpg","note":"Undead alchemist with green spectral fumes and skull motifs"},
              {"id":"root-colossus","source":"64cdadd1-93eb-4490-9df8-e7acf5077cde.jpg","note":"Huge root-and-bark colossus"}
          ]

          bosses = [
              {"id":"bone-colossus","source":"fb8c7bd7-f7bc-40c5-928c-ac7e9b95ebbd.jpg","path":"assets/characters/bosses/bone-colossus.png","note":"Armored skeletal boss"},
              {"id":"abyss-queen","source":"d9e748b9-ee01-4b29-b3f8-eb9c4ecdf503.jpg","path":"assets/characters/bosses/abyss-queen.png","note":"Violet tentacled abyss sovereign"},
              {"id":"ash-patriarch","source":"c05adc5c-64e2-476a-8a4d-e92eb774c5d8.jpg","path":"assets/characters/bosses/ash-patriarch.png","note":"Ancient hooded staff-bearing patriarch"},
              {"id":"ice-abbot","source":"f1f5e3d0-6b1d-4576-b9b7-52f885bf08fc.jpg","path":"assets/characters/bosses/ice-abbot.png","note":"Frozen abbot with ice staff"},
              {"id":"mirror-executioner","source":"f50e3768-351d-4b8a-9939-ca398bdd65d7.jpg","path":"assets/characters/bosses/mirror-executioner.png","note":"Hooded executioner with a massive axe; source does not clearly show mirror armor"},
              {"id":"soul-devourer","source":"d6021025-d9b9-44da-a245-2c50822ebedc.jpg","path":"assets/characters/bosses/soul-devourer.png","note":"Undead soul-consuming shaman with green spectral energy"},
              {"id":"root-titan","source":"beb6557c-f2db-4426-b741-d0faa9c2d80f.jpg","path":"assets/characters/bosses/root-titan.png","note":"Massive rune-carved stone titan"},
              {"id":"void-hunter-boss","source":"f3f1e987-472d-41ab-aa6c-f6e11d8068ba.jpg","path":"assets/characters/bosses/void-hunter-boss.png","note":"Many-limbed void creature; visual is closer to a giant arachnid than a humanoid hunter"},
              {"id":"heart-of-tower","source":"ead1c2a5-2854-4a9c-83b7-d8964fd737cb.jpg","path":"assets/characters/bosses/heart-of-tower.png","note":"Living flesh-and-arcane heart fused to tower masonry"}
          ]

          all_items = []
          for item in heroes:
              item["path"] = item["path"] if "path" in item else f"assets/characters/heroes/{item['id']}.png"
              all_items.append(item)
          for item in enemies:
              item["path"] = f"assets/characters/enemies/{item['id']}.png"
              all_items.append(item)
          all_items.extend(bosses)

          processed_dir = Path("art-preview/processed")
          for item in all_items:
              src = processed_dir / item["source"]
              dst = Path(item["path"])
              if not src.exists():
                  raise SystemExit(f"Missing processed artwork for {item['id']}: {src}")
              with Image.open(src) as im:
                  im.load()
                  if im.format != "PNG" or im.mode != "RGBA":
                      raise SystemExit(f"Processed asset must be RGBA PNG: {src} ({im.format}/{im.mode})")
                  if im.getchannel("A").getextrema() == (255, 255):
                      raise SystemExit(f"Alpha channel is fully opaque: {src}")
                  if im.width < 512 or im.height < 512:
                      raise SystemExit(f"Unexpectedly small character asset: {src} {im.size}")
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8")

          # Keep the game profiles and combat logic unchanged; add only art lookup tables.
          enemy_ids = [x["id"] for x in enemies]
          boss_by_id = {x["id"]: Path(x["path"]).name for x in bosses}
          enemy_array = "const TB_ENEMY_ART_FILES=" + json.dumps([f"{x['id']}.png" for x in enemies], ensure_ascii=False) + ";"
          boss_files = [
              "bone-colossus.png", "abyss-queen.png", "ash-patriarch.png", "ice-abbot.png",
              "mirror-executioner.png", "soul-devourer.png", "root-titan.png",
              "void-hunter-boss.png", None, "heart-of-tower.png"
          ]
          boss_array = "const TB_BOSS_ART_FILES=" + json.dumps(boss_files, ensure_ascii=False) + ";"
          art_constants = enemy_array + boss_array + "\n"
          if "const TB_ENEMY_ART_FILES=" not in html:
              if html.count("function updateEnemy(){") != 1:
                  raise SystemExit("Could not safely locate updateEnemy() for character art lookup tables")
              html = html.replace("function updateEnemy(){", art_constants + "function updateEnemy(){", 1)

          old_render = """$('enemies').innerHTML='<span class="enemy art-enemy-'+idx+' '+(boss?'boss':'')+'" aria-label="'+(boss?'Босс':archetype.name)+'"></span>'+(boss?'<span class="enemy art-enemy-'+((idx+7)%20)+'"></span>':'')"""
          new_render = """const bossIndex=Math.max(0,Math.min(9,Math.ceil((state.mapStep||1)/7)-1));const bossSrc=TB_BOSS_ART_FILES[bossIndex];const enemySrc=TB_ENEMY_ART_FILES[idx];const renderCharacter=(src,category,label,extra)=>'<span class="enemy tb-character-enemy '+(extra||'')+'" aria-label="'+label+'"><img class="tb-character-sprite" src="./assets/characters/'+category+'/'+src+'" alt="" loading="eager" decoding="async"></span>';const primaryHtml=boss?(bossSrc?renderCharacter(bossSrc,'bosses',bossProfile.name,'boss'):'<span class="enemy art-enemy-'+idx+' boss" aria-label="Босс"></span>'):renderCharacter(enemySrc,'enemies',archetype.name,'');const secondaryHtml=boss?renderCharacter(TB_ENEMY_ART_FILES[(idx+7)%20],'enemies',archetype.name,'tb-character-secondary'):'';$('enemies').innerHTML=primaryHtml+secondaryHtml"""
          if new_render not in html:
              if html.count(old_render) != 1:
                  raise SystemExit("Could not safely locate the existing enemy/boss rendering expression")
              html = html.replace(old_render, new_render, 1)

          style_id = 'id="tb-character-battle-art-v1"'
          if style_id not in html:
              style = """<style id="tb-character-battle-art-v1">
          #enemies .tb-character-enemy{position:relative!important;display:flex!important;align-items:flex-end!important;justify-content:center!important;width:clamp(70px,15vw,108px)!important;height:clamp(88px,19vw,132px)!important;min-height:0!important;padding:0!important;margin:0 2px!important;overflow:visible!important;background:none!important;background-image:none!important;background-color:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;filter:none!important;font-size:0!important;line-height:0!important;animation:bob 1.4s ease-in-out infinite alternate!important}
          #enemies .tb-character-enemy.boss{width:clamp(104px,21vw,150px)!important;height:clamp(122px,25vw,178px)!important;z-index:2}
          #enemies .tb-character-enemy .tb-character-sprite{display:block!important;position:relative!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;object-fit:contain!important;object-position:center bottom!important;filter:drop-shadow(0 7px 12px #000b)!important;pointer-events:none!important}
          #enemies .tb-character-enemy.tb-character-secondary{width:clamp(58px,12vw,88px)!important;height:clamp(76px,16vw,112px)!important;opacity:.82}
          #enemies .tb-character-enemy::before,#enemies .tb-character-enemy::after{display:none!important;content:none!important}
          </style>
          """
              if "</head>" not in html:
                  raise SystemExit("Missing </head>; refusing to patch enemy sprite CSS")
              html = html.replace("</head>", style + "</head>", 1)

          index_path.write_text(html, encoding="utf-8")

          for group, items, target in [
              ("heroes", heroes, "assets/characters/heroes/manifest.json"),
              ("enemies", enemies, "assets/characters/enemies/manifest.json"),
              ("bosses", bosses, "assets/characters/bosses/manifest.json")
          ]:
              manifest_items = []
              for item in items:
                  with Image.open(item["path"]) as final_image:
                      final_width, final_height = final_image.size
                      final_alpha = "A" in final_image.getbands() and final_image.getchannel("A").getextrema() != (255,255)
                  manifest_items.append({
                      "filename":Path(item["path"]).name,
                      "relative_path":item["path"],
                      "category":group,
                      "exact_asset_id":("hero." if group=="heroes" else "enemy." if group=="enemies" else "boss.")+item["id"],
                      "image_format":"png",
                      "width":final_width,
                      "height":final_height,
                      "transparency":final_alpha,
                      "source_filename":item["source"].removesuffix(".png").removesuffix(".jpg"),
                      "short_description":item["note"]
                  })
              Path(target).write_text(json.dumps({"pack":"towerbound-character-art-v1","category":group,"assets":manifest_items},ensure_ascii=False,indent=2),encoding="utf-8")

          summary = {
              "heroes":len(heroes),
              "enemies":len(enemies),
              "bosses_with_art":len(bosses),
              "boss_profiles_without_dedicated_art":["boss.crimson-regent"],
              "total_unique_roles":len(heroes)+len(enemies)+len(bosses)
          }
          Path("assets/characters/qa-report.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(summary,ensure_ascii=False))
          PY
      - name: Integrate synergy emblems and skill artwork
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, shutil
          synergies = [
              {"name":"🔥 Огонь","id":"fire"},
              {"name":"☠️ Яд","id":"poison"},
              {"name":"⚡ Гроза","id":"storm"},
              {"name":"🌀 Бездна","id":"abyss"},
              {"name":"🌿 Жизнь","id":"life"},
              {"name":"🏹 Залп","id":"volley"},
              {"name":"❄️ Лёд","id":"ice"},
              {"name":"🔮 Тайна","id":"mystery"},
              {"name":"🪙 Удача","id":"luck"},
              {"name":"🩸 Кровь","id":"blood"},
              {"name":"🛡️ Стража","id":"guard"},
              {"name":"🌟 Свет","id":"light"},
              {"name":"⏳ Время","id":"time"},
              {"name":"⚔️ Сталь","id":"steel"},
              {"name":"🕯️ Дух","id":"spirit"}
          ]
          skills = [{"id":x} for x in ["fire","arcane","ice","lightning","nature","void"]]
          processed = Path("art-preview/ui-processed")
          for group,items in [("synergies",synergies),("skills",skills)]:
              target_root=Path("assets")/group
              target_root.mkdir(parents=True,exist_ok=True)
              manifest=[]
              for item in items:
                  slug=item["id"]
                  src=processed/group/(slug+".png")
                  dst=target_root/(slug+".png")
                  if not src.is_file():
                      raise SystemExit(f"Missing transparent UI artwork: {src}")
                  with Image.open(src) as im:
                      im.load()
                      if im.format!="PNG" or im.mode!="RGBA" or im.getchannel("A").getextrema()==(255,255):
                          raise SystemExit(f"Invalid transparent artwork: {src} ({im.format}/{im.mode})")
                      width,height=im.size
                      alpha_bounds=list(im.getchannel("A").getbbox() or ())
                  shutil.copy2(src,dst)
                  manifest.append({
                      "id":slug,"name":item.get("name",slug),"path":str(dst),
                      "format":"png","width":width,"height":height,
                      "transparent":True,"alpha_bounds":alpha_bounds
                  })
              (target_root/"art-manifest.json").write_text(
                  json.dumps({"pack":"towerbound-ui-art-v1","category":group,"assets":manifest},ensure_ascii=False,indent=2),
                  encoding="utf-8"
              )
          index=Path("index.html")
          html=index.read_text(encoding="utf-8")
          syn_map={x["name"]:x["id"]+".png" for x in synergies}
          declaration="const TB_SYNERGY_ART_FILES="+json.dumps(syn_map,ensure_ascii=False,separators=(",",":"))+";"+chr(10)
          old_fn="function synergyArt(name){const a=synergyArtId(name);return tbArtSvg(name,a[0],a[1],a[2])}"
          new_fn=declaration+"function synergyArt(name){const file=TB_SYNERGY_ART_FILES[name];if(file)return './assets/synergies/'+file+'?v=1';const a=synergyArtId(name);return tbArtSvg(name,a[0],a[1],a[2])}"
          if "const TB_SYNERGY_ART_FILES=" not in html:
              if html.count(old_fn)!=1:
                  raise SystemExit("Could not safely locate synergyArt(); refusing to patch index.html")
              html=html.replace(old_fn,new_fn,1)
          old_icon='<span class="tb-syn-card-icon tb-syn-atlas tb-syn-atlas-'
          if html.count(old_icon)!=1:
              raise SystemExit("Could not safely locate the synergy progress icon")
          if old_icon in html:
              start=html.index(old_icon)
              end=html.index(' aria-hidden="true"></span>',start)+len(' aria-hidden="true"></span>')
              html=html[:start]+'<img class="tb-syn-icon tb-syn-progress-icon" src="'+ "'+synergyArt(d.name)+'" +'" alt="" loading="lazy" decoding="async">'+html[end:]
          for name in ["fire","arcane","ice","lightning","nature","void"]:
              html=html.replace("./assets/skills/"+name+".svg","./assets/skills/"+name+".png")
          style_id='id="tb-synergy-skill-art-v1"'
          if style_id not in html:
              css="""<style id="tb-synergy-skill-art-v1">
          .tb-syn-progress-icon{display:block!important;flex:0 0 28px!important;width:28px!important;height:28px!important;object-fit:contain!important;filter:drop-shadow(0 2px 5px #0009) drop-shadow(0 0 5px #c6a6ff55)!important}
          .tb-relic-syn-badge .tb-syn-icon{display:block!important;width:19px!important;height:19px!important;object-fit:contain!important;filter:drop-shadow(0 1px 3px #0009)!important}
          .tb-ability-art img{object-fit:contain!important}
          </style>
          """
              if "</head>" not in html:
                  raise SystemExit("Missing </head>; refusing to add synergy/skill icon styles")
              html=html.replace("</head>",css+"</head>",1)
          index.write_text(html,encoding="utf-8")
          qa={"synergies":len(synergies),"skill_elements":len(skills),"total_ui_art":len(synergies)+len(skills),"gameplay_changed":False}
          Path("assets/ui-art-qa-report.json").write_text(json.dumps(qa,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(qa,ensure_ascii=False))
          PY
      - name: Commit integrated hero portraits
        run: |
          git config user.name "github-actions[bot]"
