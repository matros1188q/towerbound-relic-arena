name: Towerbound real card-combat balance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rpg-rework-ui.js'
      - 'rpg-rework-v2.js'
      - 'configs/balance/**'
      - 'tests/towerbound-card-balance.cjs'
      - '.github/workflows/towerbound-balance-baseline.yml'
permissions:
  contents: read
jobs:
  real-card-balance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check simulator and game syntax
        run: |
          node --check rpg-rework-ui.js
          node --check rpg-rework-v2.js
          node --check tests/towerbound-card-balance.cjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Run all 63 card-combat balance attempts
        run: node tests/towerbound-card-balance.cjs
      - name: Upload real card-combat logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: towerbound-real-card-balance
          path: artifacts/towerbound-card-balance/
          if-no-files-found: warn
