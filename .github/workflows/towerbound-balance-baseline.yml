name: Towerbound real card-combat balance
# Card-only baseline: 21 specializations x 3 deterministic seeds; no legacy active abilities.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rpg-rework-ui.js'
      - 'rpg-rework-v2.js'
      - 'configs/balance/**'
      - 'tests/towerbound-card-balance.cjs'
      - '.github/workflows/towerbound-balance-baseline.yml'
permissions:
  contents: read
jobs:
  real-card-balance:
    strategy:
      fail-fast: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1.54.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check source syntax
        run: |
          node --check rpg-rework-ui.js
          node --check rpg-rework-v2.js
          node --check tests/towerbound-card-balance.cjs
      - name: Run 63 card-only specialization attempts from level 10
        env:
          TB_BALANCE_START_LEVEL: 10
        run: node tests/towerbound-card-balance.cjs
      - name: Upload real card-combat balance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: towerbound-card-only-balance
          path: artifacts/towerbound-card-balance/
          if-no-files-found: warn
