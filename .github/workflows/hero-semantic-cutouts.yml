name: Free hero semantic cutouts
on:
  push:
    branches: [main]
    paths:
      - "scripts/segment_hero_parts.py"
      - ".github/workflows/hero-semantic-cutouts.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hero-semantic-cutouts
  cancel-in-progress: false
jobs:
  segment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free open-source segmentation stack
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==4.44.2" "pillow>=10,<12" "numpy<2"
      - name: Segment all four hero illustrations
        run: python scripts/segment_hero_parts.py
      - name: Commit semantic layers and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/rig-parts/semantic-pass
          if git diff --cached --quiet; then
            echo "No semantic cutout changes"
          else
            git commit -m "Generate free semantic cutout layers for all four heroes"
            git push
          fi
