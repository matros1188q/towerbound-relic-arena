name: Juice and PWA checks
on:
  push:
    branches: [feature/juice-and-pwa]
  pull_request:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check juice-pwa.js
      - run: node --check service-worker.js
      - run: node tests/juice-pwa.test.cjs