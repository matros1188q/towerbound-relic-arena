name: Towerbound regression checks
on:
  push:
    branches: [main, 'balance-lab/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: towerbound-checks-\${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-and-syntax:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check service-worker.js
          node --check rpg-mode.js
          node --check towerbound-engine.js
          node --check combat-visuals.js
          node --check juice-pwa.js
          node --check rpg-rework-v2.js
          node --check rpg-rework-ui.js
          node --check rpg-rework-ui.css.js
          node --check towerbound-cloud.js
          node --check towerbound-online.js
          node --check tests/balance-sim.cjs
          node --check tests/economy-sim.cjs
      - name: Validate JPG art manifests and sprite mappings
        run: npm run art:check
      - name: Run Towerbound regression assertions
        run: node tests/online-services.test.cjs
      - name: Run combat balance simulation
        run: npm run balance
      - name: Run exhaustive 250-stage simulation for all 21 builds
        run: node tests/full-250-build-balance.test.cjs
      - name: Run full 21-build balance progression simulation
        run: node tests/balance-simulation.test.cjs
      - name: Run 250-stage economy simulation
        run: npm run economy
  balance-variant-simulation:
    if: startsWith(github.ref, 'refs/heads/balance-lab/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run exhaustive 250-stage simulation for all 21 builds
        run: node tests/full-250-build-balance.test.cjs
