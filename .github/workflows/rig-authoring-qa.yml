name: Rig authoring QA
on:
  push:
    branches: [main]
    paths:
      - 'tools/rig-annotator/index.html'
      - 'scripts/build_manual_rig_cutouts.py'
      - 'annotations/**/*.json'
      - 'assets/characters/heroes/*.png'
      - '.github/workflows/rig-authoring-qa.yml'
  pull_request:
    paths:
      - 'tools/rig-annotator/index.html'
      - 'scripts/build_manual_rig_cutouts.py'
      - '.github/workflows/rig-authoring-qa.yml'
permissions:
  contents: read
jobs:
  authoring-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Compile cutout builder
        run: python -m py_compile scripts/build_manual_rig_cutouts.py
      - name: Check embedded annotator JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('tools/rig-annotator/index.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert scripts, 'No inline annotator script found'
          Path('/tmp/annotator.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/annotator.js
      - name: Build assistant-seeded Warden visible layers
        run: |
          python scripts/build_manual_rig_cutouts.py --annotations annotations/warden-rig-annotations.json --out /tmp/warden-seeded
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/warden-seeded/warden')
          report=json.loads((root/'report.json').read_text())
          assert len(report['parts']) >= 10
          assert all(p['canvas_aligned'] for p in report['parts'])
          print('Small/possibly inaccurate visible masks:', report['suspiciously_small_parts'])
          assert not {'head','torso','shield'} & set(report['suspiciously_small_parts'])
          # Small feet are expected; only core silhouette regions are gated.
          assert report['ready_for_animation'] is False
          assert (root/'source-overlay.png').is_file()
          assert report['grabcut_candidate_count'] == len(report['parts'])
          print('Warden seed exported:', len(report['parts']), 'visible-region layers')
          PY
      - name: Create visual QA contact sheet
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import json, math
          root=Path('/tmp/warden-seeded/warden')
          report=json.loads((root/'report.json').read_text())
          entries=[]
          for part in report['parts']:
              base=Image.open(root/part['file']).convert('RGBA')
              candidate=Image.open(root/(Path(part['file']).stem+'-grabcut-candidate.png')).convert('RGBA')
              bbox=base.getchannel('A').getbbox()
              if bbox:
                  entries.append((part['id'],base.crop(bbox),candidate.crop(bbox)))
          cell_w,cell_h=330,300
          cols=3
          rows=math.ceil((len(entries)+1)/cols)
          sheet=Image.new('RGB',(cols*cell_w,rows*cell_h),(27,25,31))
          draw=ImageDraw.Draw(sheet)
          def paste(im,x,y):
              bg=Image.new('RGBA',(150,245),(45,43,50,255))
              im.thumbnail((142,238))
              bg.alpha_composite(im,((150-im.width)//2,(245-im.height)//2))
              sheet.paste(bg.convert('RGB'),(x,y))
          source=Image.open('assets/characters/heroes/warden.png').convert('RGBA')
          source.thumbnail((300,245))
          sheet.paste(source.convert('RGB'),(10,10))
          draw.text((10,260),'SOURCE',fill=(245,240,230))
          for i,(name,base,candidate) in enumerate(entries,1):
              x=(i%cols)*cell_w+8
              y=(i//cols)*cell_h+8
              paste(base,x,y)
              paste(candidate,x+158,y)
              draw.text((x,y+250),name+' | polygon / GrabCut',fill=(245,240,230))
          sheet.save(root/'contact-sheet.jpg',quality=94)
          print('Cropped part comparison generated:',len(entries),'parts')
          PY
      - name: Upload Warden first-pass rig QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: warden-first-pass-rig-qa
          path: /tmp/warden-seeded/warden/
          if-no-files-found: error
          retention-days: 14
      - name: Smoke-test aligned PNG cutout export
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/warden-rig-annotations.json')
          p.write_text(json.dumps({
            'schema_version':1,'hero':'warden',
            'parts':{'head':{'polygons':[[[100,100],[180,100],[180,180],[100,180]]]}},
            'joints':{'neck':[140,110],'pelvis':[512,700]}
          }))
          PY
          python scripts/build_manual_rig_cutouts.py --annotations /tmp/warden-rig-annotations.json --out /tmp/rig-cutouts
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('/tmp/rig-cutouts/warden')
          im=Image.open(root/'head.png')
          assert im.mode=='RGBA' and im.size==(1024,1024)
          report=json.loads((root/'report.json').read_text())
          assert report['joint_count']==2 and report['parts'][0]['canvas_aligned']
          assert 'left_elbow' in report['missing_core_joints']
          PY
