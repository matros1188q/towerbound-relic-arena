name: Preserve pre-Game Feel baseline
on:
  push:
    branches: [feature/gamefeel]
    paths:
      - '.github/workflows/preserve-gamefeel-baseline.yml'
permissions:
  contents: write
jobs:
  tag-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create immutable legacy tag
        env:
          BASELINE_SHA: f1d4955873c059cd24453e69586fcc5bc9040673
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --force origin
          if git show-ref --tags --verify --quiet refs/tags/legacy-before-gamefeel; then
            existing="$(git rev-list -n 1 legacy-before-gamefeel)"
            test "$existing" = "$BASELINE_SHA"
          else
            git tag legacy-before-gamefeel "$BASELINE_SHA"
            git push origin refs/tags/legacy-before-gamefeel
          fi
