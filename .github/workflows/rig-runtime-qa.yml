name: Rig runtime QA
on:
  push:
    branches: [main, feature/combat-and-presentation-pass, fix/audit-pass]
    paths:
      - 'assets/js/character-rig-player.js'
      - 'tests/character-rig-player.test.cjs'
      - '.github/workflows/rig-runtime-qa.yml'
  pull_request:
    paths:
      - 'assets/js/character-rig-player.js'
      - 'tests/character-rig-player.test.cjs'
      - '.github/workflows/rig-runtime-qa.yml'
permissions:
  contents: read
jobs:
  runtime-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check assets/js/character-rig-player.js
      - name: Rig runtime tests
        run: node tests/character-rig-player.test.cjs
