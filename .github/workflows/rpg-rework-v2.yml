name: RPG rework v2 checks
on:
  push:
    branches: [feature/rework-v2]
    paths: ['rpg-rework-v2.js','configs/**','tests/rpg-rework-v2.test.cjs']
  pull_request:
    paths: ['rpg-rework-v2.js','configs/**','tests/rpg-rework-v2.test.cjs']
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check rpg-rework-v2.js
      - run: node tests/rpg-rework-v2.test.cjs
